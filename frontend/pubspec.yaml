name: woodcarvers_app
description: WoodCarvers - handmade wood, bamboo & palm-leaf products e-commerce app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management & routing
  get: ^4.6.6
  get_storage: ^2.1.1

  # Networking
  dio: ^5.4.3+1

  # Images
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2

  # Payments
  razorpay_flutter: ^1.3.7

  # UI helpers
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  google_fonts: ^6.2.1

  # Push notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
